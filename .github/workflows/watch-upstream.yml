name: Watch Upstream

on:
  schedule:
    # Every six hours. The check itself is cheap, but each one that finds a new
    # upstream tag starts a full image build, and a longer interval also
    # coalesces several upstream releases published inside the same window into
    # a single rebuild instead of one each.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bazzite-63-watch-upstream
  cancel-in-progress: false

jobs:
  check:
    name: Detect upstream change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      streams: ${{ steps.compare.outputs.streams }}
      stable_tag: ${{ steps.compare.outputs.stable_tag }}
      testing_tag: ${{ steps.compare.outputs.testing_tag }}
    steps:
      - name: Diff upstream tags
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          STABLE=$(gh release view --repo ublue-os/bazzite --json tagName -q .tagName)
          TESTING=$(gh release list --repo ublue-os/bazzite --json tagName,publishedAt --limit 50 \
            | jq -r '[.[] | select(.tagName|startswith("testing-"))] | sort_by(.publishedAt) | last | .tagName')

          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')

          # All flavours track the same upstream tag (only BASE_IMAGE
          # differs), so a stream is stale when ANY image's recorded base tag
          # diverges from the latest upstream tag.
          IMAGES="bazzite-63"

          # Fail closed on probe errors: a registry blip must read as "cannot
          # tell", never as "stale" — an empty reading would otherwise trigger
          # a spurious full rebuild every time GHCR hiccups. Capturing the
          # inspect output first keeps skopeo's exit status out of the jq
          # pipeline, so a probe failure aborts the run (the next hourly cron
          # retries); an image that inspects fine but carries no base-name
          # label still reads as stale, which a rebuild repairs.
          read_current_tag() {
            local image=$1 stream=$2 inspected
            inspected=$(skopeo inspect --retry-times 3 --no-tags \
              "docker://ghcr.io/${OWNER_LC}/${image}:${stream}") || return 1
            jq -r '.Labels["org.opencontainers.image.base.name"] // ""' <<< "$inspected" \
              | awk -F: 'NF>1 {print $NF}'
          }

          stream_changed() {
            local stream=$1 latest=$2 image current changed=false
            for image in $IMAGES; do
              if ! current=$(read_current_tag "$image" "$stream"); then
                echo "::error::cannot inspect ${image}:${stream} - refusing to guess staleness" >&2
                return 1
              fi
              echo "  ${image}:${stream} built on: ${current:-<none>}" >&2
              if [ "$latest" != "$current" ]; then changed=true; fi
            done
            echo "$changed"
          }

          echo "Latest upstream: stable=$STABLE  testing=$TESTING"
          STABLE_CHANGED=$(stream_changed stable "$STABLE")
          TESTING_CHANGED=$(stream_changed testing "$TESTING")
          echo "stable_changed=$STABLE_CHANGED  testing_changed=$TESTING_CHANGED"

          # One build workflow covers both streams, so the trigger takes a
          # stream SET rather than one boolean per stream. 'none' is the
          # nothing-to-do verdict and the trigger job's only skip condition --
          # composed here, where both readings are already in hand, instead of
          # as a nested ternary in the job's `with:`.
          if [ "$STABLE_CHANGED" = true ] && [ "$TESTING_CHANGED" = true ]; then
            STREAMS=both
          elif [ "$STABLE_CHANGED" = true ]; then
            STREAMS=stable
          elif [ "$TESTING_CHANGED" = true ]; then
            STREAMS=testing
          else
            STREAMS=none
          fi
          echo "streams=$STREAMS"

          {
            echo "stable_tag=$STABLE"
            echo "testing_tag=$TESTING"
            echo "streams=$STREAMS"
          } >> "$GITHUB_OUTPUT"

  trigger:
    name: Trigger build and release
    needs: check
    if: needs.check.outputs.streams != 'none'
    uses: ./.github/workflows/build.yml
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    permissions:
      contents: write
      packages: write
    with:
      streams: ${{ needs.check.outputs.streams }}
      upstream_tag_stable: ${{ needs.check.outputs.stable_tag }}
      upstream_tag_testing: ${{ needs.check.outputs.testing_tag }}
